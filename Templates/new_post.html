{% extends "base.html" %}
{% block content %}
<h1>New post</h1>
<form method="post">
    <label>Title<br /><input name="title" required /></label><br /><br />
    <label>Content (HTML allowed)<br />
        <textarea name="content" rows="10" required></textarea>
    </label><br /><br />
    <button class="btn btn-primary" type="submit">Create</button>
</form>
{% endblock %}
